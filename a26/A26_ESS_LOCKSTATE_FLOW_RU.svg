<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A26: ESS и OEM lock-state — карта доказательств</title>
  <desc id="desc">Схема A26 Engineering Mode, Binder, неизвестной выдачи подписанного токена, SBoot bit 3, синхронизации lock-state и RPMB. Пунктир обозначает недоказанные связи.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .nodeTitle { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .tag { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .observed { stroke: #2563eb; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .unresolved { stroke: #d97706; stroke-width: 3.5; stroke-dasharray: 11 9; fill: none; marker-end: url(#arrowDash); }
      .observedTag { fill: #dbeafe; }
      .unresolvedTag { fill: #ffedd5; }
      .warning { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 16; }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="60" y="66" class="title">Samsung Galaxy A26 5G (SM-A266B) — ESS / OEM lock-state</text>
  <text x="60" y="100" class="subtitle">Карта подтверждённых A26-артефактов и незакрытых звеньев. Состояние исследования на 13.11.2026.</text>
  <rect x="60" y="145" width="1480" height="54" rx="12" fill="#e2e8f0"/>
  <rect x="80" y="160" width="128" height="24" rx="12" class="observedTag"/>
  <text x="95" y="178" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="225" y="179" class="small">Подтверждено A26-файлами / инструкциями / IPC</text>
  <rect x="700" y="160" width="150" height="24" rx="12" class="unresolvedTag"/>
  <text x="716" y="178" class="tag" fill="#9a3412">UNRESOLVED</text>
  <text x="870" y="179" class="small">Не подтверждено или отсутствует полный call path</text>

  <rect x="60" y="250" width="420" height="220" class="card"/>
  <rect x="82" y="270" width="120" height="26" rx="13" class="observedTag"/>
  <text x="97" y="289" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="85" y="330" class="nodeTitle">Android EngMode client</text>
  <text x="85" y="365" class="body">EngmodeManager::makeTokenReq</text>
  <text x="85" y="394" class="body">Binder transaction 11 (0x0b)</text>
  <text x="85" y="423" class="body">getModesbit — transaction 22</text>
  <text x="85" y="451" class="small">Caller validation присутствует; клиент не подписывает токен.</text>

  <rect x="590" y="250" width="420" height="220" class="card"/>
  <rect x="612" y="270" width="120" height="26" rx="13" class="observedTag"/>
  <text x="627" y="289" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="615" y="330" class="nodeTitle">Vendor EngMode HAL</text>
  <text x="615" y="365" class="body">ISehEngmode/default · AIDL v1</text>
  <text x="615" y="394" class="body">Запрос сериализуется и передаётся HAL</text>
  <text x="615" y="423" class="body">Сервисная реализация изучена не полностью</text>
  <text x="615" y="451" class="small">A26-specific transaction map; не переносить с S24.</text>

  <rect x="1120" y="250" width="420" height="220" class="card"/>
  <rect x="1142" y="270" width="150" height="26" rx="13" class="unresolvedTag"/>
  <text x="1157" y="289" class="tag" fill="#9a3412">UNRESOLVED</text>
  <text x="1145" y="330" class="nodeTitle">ESS signed token</text>
  <text x="1145" y="365" class="body">Канал выдачи Samsung не установлен</text>
  <text x="1145" y="394" class="body">Валидный токен для этого аппарата не получен</text>
  <text x="1145" y="423" class="body">SingleID / OTP / install path не закрыты</text>
  <text x="1145" y="451" class="small">Нельзя локально подменить подпись или выдумать OTP.</text>

  <path d="M480 360 H580" class="observed"/>
  <text x="500" y="340" class="small">AIDL IPC</text>
  <path d="M1010 360 H1110" class="unresolved"/>
  <text x="1021" y="340" class="small">token issuance</text>

  <rect x="60" y="570" width="420" height="225" class="card"/>
  <rect x="82" y="590" width="120" height="26" rx="13" class="observedTag"/>
  <text x="97" y="609" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="85" y="650" class="nodeTitle">SBoot mode bitmap</text>
  <text x="85" y="685" class="body">fcn.001895dc(3) читает bit 3</text>
  <text x="85" y="714" class="body">Бит используется функцией синхронизации</text>
  <text x="85" y="743" class="body">A26 enum label для bit 3 не доказан</text>
  <text x="85" y="775" class="small">Mode 3 — гипотеза по другому Samsung, не вывод A26.</text>

  <rect x="590" y="570" width="420" height="225" class="card"/>
  <rect x="612" y="590" width="120" height="26" rx="13" class="observedTag"/>
  <text x="627" y="609" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="615" y="650" class="nodeTitle">SBoot lock-state sync</text>
  <text x="615" y="685" class="body">fcn.0017dfdc</text>
  <text x="615" y="714" class="body">log: sync_lockstate_custtoken</text>
  <text x="615" y="743" class="body">Сверяет bit 3 и cached state</text>
  <text x="615" y="775" class="small">Boolean polarity / caller semantics не установлены.</text>

  <rect x="1120" y="570" width="420" height="225" class="card"/>
  <rect x="1142" y="590" width="120" height="26" rx="13" class="observedTag"/>
  <text x="1157" y="609" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="1145" y="650" class="nodeTitle">Guarded state setter</text>
  <text x="1145" y="685" class="body">fcn.001257bc(boolean-like value)</text>
  <text x="1145" y="714" class="body">log: rpmb_set_lock_state</text>
  <text x="1145" y="743" class="body">Вызывает storage helper fcn.00123f14</text>
  <text x="1145" y="775" class="small">Направление 0/1 и конкретное поле не расшифрованы.</text>

  <rect x="590" y="865" width="420" height="125" class="card"/>
  <rect x="612" y="883" width="120" height="26" rx="13" class="observedTag"/>
  <text x="627" y="902" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="615" y="942" class="nodeTitle">RPMB / protected storage</text>
  <text x="615" y="972" class="small">Аутентификация / фактическое состояние не модифицировать.</text>

  <path d="M480 680 H580" class="observed"/>
  <path d="M1010 680 H1110" class="observed"/>
  <path d="M1330 795 V830 H800 V855" class="observed"/>
  <text x="1040" y="820" class="small">storage path</text>
  <path d="M1330 470 V520 H270 V560" class="unresolved"/>
  <text x="760" y="510" class="small">token install → mode bitmap: A26 chain incomplete</text>

  <rect x="60" y="1020" width="1480" height="72" class="warning"/>
  <text x="88" y="1050" class="nodeTitle" fill="#9f1239">Вывод: поддерживаемый пользовательский unlock-путь не доказан.</text>
  <text x="88" y="1078" class="body" fill="#9f1239">Не прошивать, не делать downgrade, не патчить SBoot, не устанавливать экспериментальные токены и не писать в RPMB/STEADY.</text>
</svg>