<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A26: ESS, CertResTBE, STEADY и OEM lock-state</title>
  <desc id="desc">Подробная карта A26: Android EngMode Binder путь, неподтверждённая выдача ESS токена, CertResTBE readiness gate, найденный раздел STEADY sda3, отдельная SecureBoot signature validation, 32-байтовый mode bitmap, OEM lock-state sync, recovery wipe command и неизвестный нижний storage destination.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .nodeTitle { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .tag { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .observed { stroke: #2563eb; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .unresolved { stroke: #d97706; stroke-width: 3.5; stroke-dasharray: 11 9; fill: none; marker-end: url(#arrowDash); }
      .observedTag { fill: #dbeafe; }
      .unresolvedTag { fill: #ffedd5; }
      .warning { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 16; }
      .gate { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 16; }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 12; }
    </style>
  </defs>
  <rect width="1800" height="1540" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Samsung Galaxy A26 5G (SM-A266B) — ESS / STEADY / OEM lock-state</text>
  <text x="60" y="96" class="subtitle">Обновлённая карта доказательств по A266BXXUCDZJ6 · Android 17 / One UI 9 · 13.11.2026</text>

  <rect x="60" y="125" width="1680" height="58" rx="12" fill="#e2e8f0"/>
  <rect x="82" y="143" width="128" height="24" rx="12" class="observedTag"/>
  <text x="97" y="161" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="225" y="161" class="small">Подтверждено кодом J6 или read-only наблюдением на телефоне</text>
  <rect x="780" y="143" width="150" height="24" rx="12" class="unresolvedTag"/>
  <text x="796" y="161" class="tag" fill="#9a3412">UNRESOLVED</text>
  <text x="950" y="161" class="small">Связь, семантика или конечный результат пока не доказаны</text>

  <!-- Android client / HAL / ESS -->
  <rect x="60" y="220" width="500" height="205" class="card"/>
  <rect x="82" y="240" width="120" height="26" rx="13" class="observedTag"/>
  <text x="97" y="259" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="85" y="300" class="nodeTitle">Android EngMode client</text>
  <text x="85" y="337" class="body">EngmodeManager::makeTokenReq</text>
  <text x="85" y="367" class="body">Binder transaction 11 (0x0b)</text>
  <text x="85" y="397" class="body">getModesbit — transaction 22</text>

  <rect x="650" y="220" width="500" height="205" class="card"/>
  <rect x="672" y="240" width="120" height="26" rx="13" class="observedTag"/>
  <text x="687" y="259" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="675" y="300" class="nodeTitle">Vendor EngMode HAL</text>
  <text x="675" y="337" class="body">ISehEngmode/default · AIDL v1</text>
  <text x="675" y="367" class="body">Request serialized and forwarded</text>
  <text x="675" y="397" class="small">Service-side token issuance path not fully reconstructed.</text>

  <rect x="1240" y="220" width="500" height="205" class="card"/>
  <rect x="1262" y="240" width="150" height="26" rx="13" class="unresolvedTag"/>
  <text x="1277" y="259" class="tag" fill="#9a3412">UNRESOLVED</text>
  <text x="1265" y="300" class="nodeTitle">ESS signed token</text>
  <text x="1265" y="337" class="body">Samsung issuance channel not established</text>
  <text x="1265" y="367" class="body">No valid token for this handset obtained</text>
  <text x="1265" y="397" class="small">SingleID / OTP / installation chain remains open.</text>

  <path d="M560 322 H640" class="observed"/>
  <text x="575" y="300" class="small">AIDL IPC</text>
  <path d="M1150 322 H1230" class="unresolved"/>
  <text x="1162" y="300" class="small">token issuance</text>

  <!-- Early init, physical STEADY, signature parser, bitmap -->
  <rect x="60" y="500" width="385" height="255" class="card"/>
  <rect x="82" y="520" width="120" height="26" rx="13" class="observedTag"/>
  <text x="97" y="539" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="85" y="580" class="nodeTitle">CertResTBE readiness</text>
  <text x="85" y="617" class="body">fcn.00114100 → fcn.0010ffcc</text>
  <text x="85" y="647" class="body">fcn.0010a57c processes CertResTBE</text>
  <text x="85" y="677" class="body">sets 0x540000+0x41c = 1 on a</text>
  <text x="85" y="707" class="body">handled-result path</text>
  <text x="85" y="737" class="small">Readiness flag; not proven OEM grant / ESS token bit.</text>

  <rect x="485" y="500" width="385" height="255" class="card"/>
  <rect x="507" y="520" width="120" height="26" rx="13" class="observedTag"/>
  <text x="522" y="539" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="510" y="580" class="nodeTitle">PIT → STEADY catalog</text>
  <text x="510" y="617" class="body">fcn.00175b28 loads resource key "PIT"</text>
  <text x="510" y="647" class="body">magic 0x12349876; records stride 0x84</text>
  <text x="510" y="677" class="body">fcn.001758fc searches key "STEADY"</text>
  <text x="510" y="707" class="body">mode=1 selects SCSI; record +0x1c → scsiN</text>
  <text x="510" y="737" class="small">Device: sda3 · 4 MiB · RO=1; exact LBA unresolved.</text>

  <rect x="910" y="500" width="385" height="255" class="card"/>
  <rect x="932" y="520" width="120" height="26" rx="13" class="observedTag"/>
  <text x="947" y="539" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="935" y="580" class="nodeTitle">STEADY secure parser</text>
  <text x="935" y="617" class="body">fcn.00189d8c → fcn.0018962c</text>
  <text x="935" y="647" class="body">record +0x14 → offset-like value + 0x12 / 0x28</text>
  <text x="935" y="677" class="body">fcn.001390c0 → SCSI object method [obj+0xa8]</text>
  <text x="935" y="707" class="body">fcn.001690d8 → signature check → finalize</text>
  <text x="935" y="737" class="small">Offset units and concrete scsiN → sda mapping unknown.</text>

  <rect x="1335" y="500" width="405" height="255" class="card"/>
  <rect x="1357" y="520" width="120" height="26" rx="13" class="observedTag"/>
  <text x="1372" y="539" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="1360" y="580" class="nodeTitle">32-byte mode bitmap</text>
  <text x="1360" y="617" class="body">Copied to 0x5a6000+0xa90</text>
  <text x="1360" y="647" class="body">fcn.001895dc(3) reads bit 3</text>
  <text x="1360" y="677" class="body">bit 3 used by OEM state sync</text>
  <text x="1360" y="707" class="body">A26 enum name remains unknown</text>
  <text x="1360" y="737" class="small">Do not equate with 0x11860810 bit 3 (hardware gate).</text>

  <path d="M445 600 V470 H1100 V490" class="observed"/>
  <text x="650" y="460" class="small">CertResTBE readiness gate required by STEADY loader</text>
  <path d="M870 630 H900" class="unresolved"/>
  <text x="872" y="610" class="small">STEADY backend mapping</text>
  <path d="M1295 630 H1325" class="observed"/>
  <text x="1298" y="610" class="small">verified</text>

  <rect x="60" y="790" width="1680" height="62" class="gate"/>
  <text x="85" y="818" class="nodeTitle">PIT resource backend + additional loader gates</text>
  <text x="85" y="841" class="small">PIT: fcn.0017f3dc → SMC -0xf0 / subcode 0x0e; EL3 integrity check. Storage mode=1 is set before PIT load and selects scsiN (mode 2 selects mmcN/mmcrpmb). Other gates: CertResTBE, runtime state, HW/SMC bit 3.</text>

  <!-- OEM sync / setter -->
  <rect x="180" y="900" width="620" height="225" class="card"/>
  <rect x="202" y="920" width="120" height="26" rx="13" class="observedTag"/>
  <text x="217" y="939" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="205" y="980" class="nodeTitle">OEM lock-state synchronizer</text>
  <text x="205" y="1017" class="body">fcn.00115610 → fcn.0017df80 → fcn.0017dfdc</text>
  <text x="205" y="1047" class="body">MISC record lookup; compare cached state with bit 3</text>
  <text x="205" y="1077" class="body">Consistent pair → setter receives 1 - bit 3</text>
  <text x="205" y="1107" class="small">Builds recovery --wipe_data --reason=bootloader_unlock args.</text>

  <rect x="1000" y="900" width="620" height="225" class="card"/>
  <rect x="1022" y="920" width="120" height="26" rx="13" class="observedTag"/>
  <text x="1037" y="939" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="1025" y="980" class="nodeTitle">Cache setter / backend transport</text>
  <text x="1025" y="1017" class="body">fcn.001257bc updates cache 0x56f000+0x8f0</text>
  <text x="1025" y="1047" class="body">fcn.00123f14 receives backend ID + operation + object</text>
  <text x="1025" y="1077" class="body">Generic I/O / ICM / USB-related transport branches</text>
  <text x="1025" y="1107" class="small">Final storage destination is not proven to be RPMB.</text>

  <path d="M1537 755 V875 H490 V890" class="observed"/>
  <text x="895" y="875" class="small">bit 3 → reconciliation</text>
  <path d="M800 1012 H990" class="observed"/>
  <text x="858" y="990" class="small">setter request</text>

  <!-- Separate result and unresolved linkage -->
  <rect x="60" y="1170" width="520" height="165" class="card"/>
  <rect x="82" y="1190" width="120" height="26" rx="13" class="observedTag"/>
  <text x="97" y="1209" class="tag" fill="#1d4ed8">OBSERVED</text>
  <text x="85" y="1250" class="nodeTitle">Downstream response handlers</text>
  <text x="85" y="1287" class="body">fcn.00153180 / fcn.00153998</text>
  <text x="85" y="1317" class="small">Later siblings; not direct callers of the synchronizer.</text>

  <rect x="640" y="1170" width="520" height="165" class="card"/>
  <rect x="662" y="1190" width="150" height="26" rx="13" class="unresolvedTag"/>
  <text x="677" y="1209" class="tag" fill="#9a3412">UNRESOLVED</text>
  <text x="665" y="1250" class="nodeTitle">Recovery command execution</text>
  <text x="665" y="1287" class="body">Command buffer is constructed in SBoot</text>
  <text x="665" y="1317" class="small">External event / actual Recovery launch not yet traced.</text>

  <rect x="1220" y="1170" width="520" height="165" class="card"/>
  <rect x="1242" y="1190" width="150" height="26" rx="13" class="unresolvedTag"/>
  <text x="1257" y="1209" class="tag" fill="#9a3412">UNRESOLVED</text>
  <text x="1245" y="1250" class="nodeTitle">Supported end-user unlock</text>
  <text x="1245" y="1287" class="body">Device Unlock Mode does not appear on handset</text>
  <text x="1245" y="1317" class="small">No reproducible supported unlock procedure established.</text>

  <path d="M490 1125 V1158 H900 V1160" class="unresolved"/>
  <text x="695" y="1151" class="small">wipe args built ≠ reboot / unlock confirmed</text>
  <path d="M1160 1252 H1210" class="unresolved"/>
  <text x="1165" y="1232" class="small">policy → user flow</text>

  <rect x="60" y="1380" width="1680" height="100" class="warning"/>
  <text x="88" y="1418" class="nodeTitle" fill="#9f1239">Вывод: штатный unlock-related wipe workflow найден, но доступность unlock не доказана.</text>
  <text x="88" y="1452" class="body" fill="#9f1239">Не прошивать TWRP, не писать в recovery / STEADY / RPMB, не патчить SBoot и не делать downgrade ниже BIT 12.</text>
</svg>