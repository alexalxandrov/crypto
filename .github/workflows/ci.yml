name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [freelance, crypto_arbitrage, paid_oss, bug_bounty, automation]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd work/projects/${{ matrix.project }}
          pip install -r requirements.txt
          pip install pytest responses
      - name: Run tests
        run: |
          cd work/projects/${{ matrix.project }}
          pytest tests

      - name: Build Docker image (micro_service_api_scraper)
        if: matrix.project == 'micro_service_api_scraper'
        run: |
          cd work/projects/${{ matrix.project }}
          docker build -t microservice-image .
        env:
          DOCKER_BUILDKIT: 1