name: Bug Bounty Fetcher

on:
  schedule:
    - cron: '0 3 * * *' # run every day at 03:00 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run fetcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HACKERONE_TOKEN: ${{ secrets.HACKERONE_TOKEN }}
        run: python work/research/bug_bounty_fetcher.py
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update bug bounty list (nightly fetch)"
          file_pattern: "work/research/bug_bounty_list.csv"
          repository: "${{ github.workspace }}"
          branch: "main"
